name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Mirror to cPanel over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          mirror -R --verbose --parallel=4 --delete \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
            --exclude-glob README.MD --exclude-glob CONTENT.md --exclude-glob generate-manifest.sh \
            --exclude-glob cgi-bin/ --exclude-glob .well-known/ --exclude-glob .htaccess \
            ./ /
          bye
          EOF
